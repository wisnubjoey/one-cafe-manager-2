<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --text: #1d1d1f;
            --muted: #86868b;
            --border: #f2f2f4;
            --badge-bg: #f5f5f7;
            --overlay: rgba(0, 0, 0, 0.4);
            --radius: 14px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
        }

        /* ---------- Search Bar ---------- */
        .search-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 18px 24px;
        }

        .search-wrap {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--badge-bg);
            border-radius: 12px;
            padding: 10px 14px;
            transition: box-shadow .2s ease;
        }

        .search-wrap:focus-within {
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            color: var(--muted);
            flex-shrink: 0;
        }

        #search {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: var(--text);
            font-family: inherit;
        }

        #search::placeholder {
            color: var(--muted);
        }

        /* ---------- Header ---------- */
        .header {
            max-width: 1080px;
            margin: 0 auto;
            padding: 40px 24px 8px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .header p {
            margin-top: 4px;
            color: var(--muted);
            font-size: 14px;
        }

        /* ---------- Grid ---------- */
        .grid {
            max-width: 1080px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        /* ---------- Card ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: var(--badge-bg);
            display: block;
        }

        .card-body {
            padding: 14px 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .card-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .variant-badge {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            background: var(--badge-bg);
            padding: 3px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 24px;
            opacity: 0;
            transition: opacity .25s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: var(--surface);
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            transform: scale(.96);
            transition: transform .25s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: var(--badge-bg);
            display: block;
        }

        .modal-body {
            padding: 28px 28px 32px;
            text-align: center;
        }

        .modal-name {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .modal-variant {
            margin-top: 8px;
            font-size: 14px;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.85);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .modal-close:hover {
            background: #fff;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 60px 0;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .grid {
                gap: 16px;
                padding: 16px;
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                padding: 24px 16px 4px;
            }

            .header h1 {
                font-size: 22px;
            }

            .card-body {
                padding: 10px 12px 14px;
            }

            .card-name {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="search-bar">
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="search" type="text" placeholder="Search the catalog" autocomplete="off">
        </div>
    </div>

    <div class="header">
        <h1>Catalog</h1>
        <p id="count"></p>
    </div>

    <div class="grid" id="grid"></div>

    <div class="modal-overlay" id="overlay">
        <div class="modal">
            <img class="modal-img" id="modalImg" alt="">
            <div class="modal-body">
                <div class="modal-name" id="modalName"></div>
                <div class="modal-variant" id="modalVariant"></div>
            </div>
        </div>
        <button class="modal-close" id="closeBtn" aria-label="Close">&times;</button>
    </div>

    <script>
        // Strict data: each item has EXACTLY three fields — image, name, variant
        const items = [
            { image: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=600&q=80", name: "water", variant: "200ML" },
            { image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600&q=80", name: "water", variant: "500ML" },
            { image: "https://images.unsplash.com/photo-1606767347981-3b5cad8bf56c?w=600&q=80", name: "water", variant: "1L" },
            { image: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=600&q=80", name: "coffee", variant: "250ML" },
            { image: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=600&q=80", name: "coffee", variant: "350ML" },
            { image: "https://images.unsplash.com/photo-1437418747212-8d9709afab22?w=600&q=80", name: "orange juice", variant: "300ML" },
            { image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=600&q=80", name: "milk", variant: "1L" },
            { image: "https://images.unsplash.com/photo-1556881286-fc6915faf948?w=600&q=80", name: "milk", variant: "500ML" },
            { image: "https://images.unsplash.com/photo-1596986808085-1d4af5a94b59?w=600&q=80", name: "soda", variant: "330ML" },
            { image: "https://images.unsplash.com/photo-1625772299848-391ec8cc94f8?w=600&q=80", name: "tea", variant: "250ML" },
            { image: "https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=600&q=80", name: "tea", variant: "500ML" },
            { image: "https://images.unsplash.com/photo-1596678146152-eb55b14a1f6a?w=600&q=80", name: "energy drink", variant: "250ML" },
        ];

        const grid = document.getElementById('grid');
        const countEl = document.getElementById('count');
        const search = document.getElementById('search');
        const overlay = document.getElementById('overlay');
        const modalImg = document.getElementById('modalImg');
        const modalName = document.getElementById('modalName');
        const modalVariant = document.getElementById('modalVariant');
        const closeBtn = document.getElementById('closeBtn');

        function render(list) {
            countEl.textContent = list.length + (list.length === 1 ? " item" : " items");
            if (!list.length) {
                grid.innerHTML = '<div class="empty">No results</div>';
                return;
            }
            grid.innerHTML = list.map((it, i) => `
      <div class="card" data-i="${items.indexOf(it)}">
        <img class="card-img" loading="lazy" src="${it.image}" alt="${it.name}">
        <div class="card-body">
          <span class="card-name">${it.name}</span>
          <span class="variant-badge">${it.variant}</span>
        </div>
      </div>
    `).join('');
        }

        search.addEventListener('input', () => {
            const q = search.value.trim().toLowerCase();
            render(items.filter(it =>
                it.name.toLowerCase().includes(q) ||
                it.variant.toLowerCase().includes(q)
            ));
        });

        grid.addEventListener('click', e => {
            const card = e.target.closest('.card');
            if (!card) return;
            const it = items[+card.dataset.i];
            modalImg.src = it.image;
            modalImg.alt = it.name;
            modalName.textContent = it.name;
            modalVariant.textContent = it.variant;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        function closeModal() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        render(items);
    </script>
</body>

</html>
